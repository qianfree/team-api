<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team-API - 系统初始化</title>
    <!--
        样式完全自包含（零外部依赖）：
        初始化向导是全新部署（可能离线/内网）看到的第一个页面，
        禁止引用 cdn.tailwindcss.com / Google Fonts 等外部资源 ——
        会被全站 CSP（script-src/style-src 'self'）拦截，也会在受限网络下加载失败。
        下方样式为页面所用工具类的最小本地实现，视觉与 Tailwind 版本保持一致。
    -->
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        button, input { font: inherit; }
        button { border: 0; background: none; cursor: pointer; }
        ::placeholder { color: #9ca3af; opacity: 1; }

        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; }

        /* ---- 布局工具类（本地最小实现） ---- */
        .min-h-screen { min-height: 100vh; }
        .block { display: block; }
        .flex { display: flex; }
        .inline-flex { display: inline-flex; }
        .grid { display: grid; }
        .items-center { align-items: center; }
        .items-start { align-items: flex-start; }
        .justify-center { justify-content: center; }
        .text-center { text-align: center; }
        .w-full { width: 100%; }
        .max-w-md { max-width: 28rem; }
        .w-12, .h-12 { width: 3rem; height: 3rem; }
        .w-6, .h-6 { width: 1.5rem; height: 1.5rem; }
        .w-4, .h-4 { width: 1rem; height: 1rem; }
        .flex-shrink-0 { flex-shrink: 0; }
        .grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .gap-2 { gap: 0.5rem; }
        .gap-2\.5 { gap: 0.625rem; }
        .cursor-pointer { cursor: pointer; }
        .outline-none { outline: none; }

        /* ---- 间距 ---- */
        .p-4 { padding: 1rem; }
        .p-8 { padding: 2rem; }
        @media (min-width: 640px) { .sm\:p-10 { padding: 2.5rem; } }
        .px-3\.5 { padding-left: 0.875rem; padding-right: 0.875rem; }
        .py-2\.5 { padding-top: 0.625rem; padding-bottom: 0.625rem; }
        .pt-1\.5 { padding-top: 0.375rem; }
        .mb-8 { margin-bottom: 2rem; }
        .mb-7 { margin-bottom: 1.75rem; }
        .mb-4 { margin-bottom: 1rem; }
        .mb-1\.5 { margin-bottom: 0.375rem; }
        .mt-6 { margin-top: 1.5rem; }
        .mt-1\.5 { margin-top: 0.375rem; }
        .mt-0\.5 { margin-top: 0.125rem; }
        .ml-1 { margin-left: 0.25rem; }
        .space-y-4 > * + * { margin-top: 1rem; }
        .space-y-4\.5 > * + * { margin-top: 1.125rem; }

        /* ---- 字体/排版 ---- */
        .text-xs { font-size: 12px; line-height: 16px; }
        .text-sm { font-size: 14px; line-height: 20px; }
        .text-2xl { font-size: 24px; line-height: 32px; }
        .font-normal { font-weight: 400; }
        .font-medium { font-weight: 500; }
        .font-semibold { font-weight: 600; }
        .tracking-tight { letter-spacing: -0.025em; }
        .font-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }

        /* ---- 颜色 ---- */
        .bg-white { background-color: #ffffff; }
        .bg-gray-50 { background-color: #f9fafb; }
        .bg-red-50 { background-color: #fef2f2; }
        .text-white { color: #ffffff; }
        .text-gray-900 { color: #111827; }
        .text-gray-700 { color: #374151; }
        .text-gray-500 { color: #6b7280; }
        .text-gray-400 { color: #9ca3af; }
        .text-red-700 { color: #b91c1c; }
        .text-red-500 { color: #ef4444; }
        .text-amber-600 { color: #d97706; }
        .accent-primary { accent-color: #2563eb; }

        /* ---- 边框/圆角 ---- */
        .border { border-width: 1px; border-style: solid; border-color: #e5e7eb; }
        .border-gray-200 { border-color: #e5e7eb; }
        .border-red-100 { border-color: #fee2e2; }
        .rounded-lg { border-radius: 0.5rem; }
        .rounded-xl { border-radius: 0.75rem; }
        .rounded-2xl { border-radius: 1rem; }
        .transition-colors { transition-property: color, background-color, border-color, text-decoration-color, fill, stroke; transition-duration: 150ms; transition-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }

        /* ---- 页面自有样式 ---- */
        .setup-card {
            box-shadow:
                0 0 0 1px rgba(0, 0, 0, 0.03),
                0 2px 4px rgba(0, 0, 0, 0.03),
                0 12px 24px rgba(0, 0, 0, 0.06);
        }

        .input-field {
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }
        .input-field:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }

        .btn-primary {
            background-color: #2563eb;
            transition: background-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
        }
        .btn-primary:hover:not(:disabled) {
            background-color: #1d4ed8;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .btn-primary:active:not(:disabled) {
            transform: translateY(0.5px);
        }
        .btn-primary:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .currency-option.selected {
            border-color: #2563eb;
            background-color: rgba(37, 99, 235, 0.04);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(12px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-up {
            animation: fadeUp 0.4s ease-out both;
        }
        .delay-1 { animation-delay: 0.05s; }
        .delay-2 { animation-delay: 0.1s; }
        .delay-3 { animation-delay: 0.15s; }
        .delay-4 { animation-delay: 0.2s; }
        .delay-5 { animation-delay: 0.25s; }
        .delay-6 { animation-delay: 0.3s; }
        .delay-7 { animation-delay: 0.35s; }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .spinner {
            display: inline-block;
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            vertical-align: middle;
            margin-right: 8px;
        }

        .error-box {
            transition: opacity 0.2s ease, max-height 0.2s ease;
            max-height: 0;
            opacity: 0;
            overflow: hidden;
        }
        .error-box.visible {
            max-height: 80px;
            opacity: 1;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(160deg, #f0f4f8 0%, #e8edf5 50%, #f5f3ff 100%);">

    <div class="w-full max-w-md">
        <div class="setup-card bg-white rounded-2xl p-8 sm:p-10">

            <!-- Branding -->
            <div class="text-center mb-8 animate-fade-up">
                <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl mb-4" style="background: linear-gradient(135deg, #2563eb, #1d4ed8);">
                    <svg class="w-6 h-6 text-white" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M5.25 14.25h13.5m-13.5 0a3 3 0 01-3-3m3 3a3 3 0 100 6h13.5a3 3 0 100-6m-16.5-3a3 3 0 013-3h13.5a3 3 0 013 3m-19.5 0a4.5 4.5 0 01.9-2.7L5.737 5.1a3.375 3.375 0 012.7-1.35h7.126c1.062 0 2.062.5 2.7 1.35l2.587 3.45a4.5 4.5 0 01.9 2.7m0 0a3 3 0 01-3 3m0 3h.008v.008h-.008v-.008zm0-6h.008v.008h-.008v-.008zm-3 6h.008v.008h-.008v-.008zm0-6h.008v.008h-.008v-.008z"/>
                    </svg>
                </div>
                <h1 class="text-2xl font-semibold text-gray-900 tracking-tight">Team-API</h1>
                <p class="text-sm text-gray-500 mt-1.5">系统初始化设置</p>
            </div>

            <!-- Description -->
            <p class="text-sm text-gray-400 mb-7 animate-fade-up delay-1">
                首次使用，请创建管理员账号以开始配置系统
            </p>

            <!-- Form -->
            <form id="setupForm" class="space-y-4.5" autocomplete="off">
                <div class="space-y-4">
                    <!-- Username -->
                    <div class="animate-fade-up delay-2">
                        <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">用户名</label>
                        <input
                            type="text" id="username" name="username" required autofocus
                            class="input-field w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-900 outline-none"
                            placeholder="3-20位，字母/数字/下划线" autocomplete="off" spellcheck="false">
                    </div>

                    <!-- Display Name -->
                    <div class="animate-fade-up delay-3">
                        <label for="displayName" class="block text-sm font-medium text-gray-700 mb-1.5">
                            显示名称 <span class="text-gray-400 font-normal">(可选)</span>
                        </label>
                        <input
                            type="text" id="displayName" name="displayName"
                            class="input-field w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-900 outline-none"
                            placeholder="管理员显示名称" autocomplete="off">
                    </div>

                    <!-- Password -->
                    <div class="animate-fade-up delay-4">
                        <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">密码</label>
                        <input
                            type="password" id="password" name="password" required
                            class="input-field w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-900 outline-none font-mono"
                            placeholder="至少8位，含字母和数字" autocomplete="new-password">
                    </div>

                    <!-- Confirm Password -->
                    <div class="animate-fade-up delay-5">
                        <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-1.5">确认密码</label>
                        <input
                            type="password" id="confirmPassword" name="confirmPassword" required
                            class="input-field w-full px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-lg text-sm text-gray-900 outline-none font-mono"
                            placeholder="再次输入密码" autocomplete="new-password">
                    </div>

                    <!-- Base Currency -->
                    <div class="animate-fade-up delay-6">
                        <label class="block text-sm font-medium text-gray-700 mb-1.5">
                            本位币
                            <span class="text-amber-600 font-normal text-xs ml-1">初始化后不可更改</span>
                        </label>
                        <div class="grid grid-cols-2 gap-2.5" id="currencyGroup">
                            <label class="currency-option cursor-pointer flex items-start gap-2.5 px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-lg transition-colors" data-value="USD">
                                <input type="radio" name="currency" value="USD" checked class="mt-0.5 accent-primary">
                                <span>
                                    <span class="block text-sm font-medium text-gray-900">USD（美元）</span>
                                    <span class="block text-xs text-gray-400 mt-0.5">与上游模型报价对齐</span>
                                </span>
                            </label>
                            <label class="currency-option cursor-pointer flex items-start gap-2.5 px-3.5 py-2.5 bg-gray-50 border border-gray-200 rounded-lg transition-colors" data-value="CNY">
                                <input type="radio" name="currency" value="CNY" class="mt-0.5 accent-primary">
                                <span>
                                    <span class="block text-sm font-medium text-gray-900">CNY（人民币）</span>
                                    <span class="block text-xs text-gray-400 mt-0.5">面向国内运营</span>
                                </span>
                            </label>
                        </div>
                        <p class="text-xs text-gray-400 mt-1.5">决定系统内部记账与全站显示货币，模型定价按本位币配置</p>
                    </div>
                </div>

                <!-- Error -->
                <div id="errorArea" class="error-box">
                    <div class="flex items-start gap-2 text-sm text-red-700 bg-red-50 border border-red-100 px-3.5 py-2.5 rounded-lg">
                        <svg class="w-4 h-4 mt-0.5 flex-shrink-0 text-red-500" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
                        </svg>
                        <span id="errorText"></span>
                    </div>
                </div>

                <!-- Submit -->
                <div class="pt-1.5 animate-fade-up delay-7">
                    <button
                        type="submit" id="submitBtn"
                        class="btn-primary w-full text-white py-2.5 rounded-lg text-sm font-medium">
                        初始化系统
                    </button>
                </div>
            </form>
        </div>

        <p class="text-center text-xs text-gray-400 mt-6">
            初始化完成后将自动跳转至登录页面
        </p>
    </div>

    <script src="/setup.js"></script>
</body>
</html>
