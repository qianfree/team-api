<body class="min-h-screen flex items-center justify-center p-4" style="background: linear-gradient(160deg, #f0f4f8 0%, #e8edf5 50%, #f5f3ff 100%);">

                <h1 class="text-2xl font-semibold text-gray-900 tracking-tight">Team-API</h1>

            <!-- Intro -->
            <p class="text-sm text-gray-500 text-center mb-8">
                统一接入 OpenAI / Claude / Gemini 等主流大模型，为多租户提供 API Key 管理与计费能力
            </p>

            <!-- Frontend entry -->
            <div class="space-y-3">
                <a href="/admin" class="entry-btn flex items-center justify-between w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 hover:bg-gray-100">
                    <span>管理后台</span>
                    <span class="text-xs text-gray-400">平台运营</span>
                </a>
                <a href="/" class="entry-btn flex items-center justify-between w-full bg-gray-50 border border-gray-200 rounded-xl px-4 py-3 text-sm text-gray-700 hover:bg-gray-100">

                    <span class="text-xs text-gray-400">组织使用</span>
                </a>
            </div>

            <!-- Dev hint -->
            <p class="text-center text-xs text-gray-400 mt-6">
                开发环境请通过 Vite 访问
                <a id="dev-admin" href="#" class="text-blue-600 hover:underline">管理后台 :4001</a>
                <span class="mx-1">·</span>
                <a id="dev-tenant" href="#" class="text-blue-600 hover:underline">租户控制台 :4002</a>
            </p>

            <p class="text-center text-xs text-gray-400 mt-4">
                Team-API v<span id="version">__VERSION__</span>
            </p>
        </div>
    </div>

    <script>
        (function () {
            // 开发环境前端 Vite 开发服务器地址（管理后台 :4001 / 租户控制台 :4002），按当前 hostname 动态拼接
            var host = window.location.hostname || 'localhost';
            var admin = document.getElementById('dev-admin');
            var tenant = document.getElementById('dev-tenant');
            if (admin) admin.href = 'http://' + host + ':4001';
            if (tenant) tenant.href = 'http://' + host + ':4002';
        })();
    </script>
