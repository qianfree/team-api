
# CLI tool configuration, only used in development environment.
# https://goframe.org/docs/cli
gfcli:
  gen:
    dao:
      - link: "pgsql:<user>:<password>@tcp(<host>:<port>)/<database>"
        type: "pgsql"
        tables: ""
        tablesEx: ""
        prefix: ""
        removePrefix: ""
        descriptionTag: true
        noModelComment: false
        fieldTag: "json,cbor,yaml,xml,toml"
        jsonCase: "SnakeCase"
        path: "./"
        modelPath: "./internal/model"
        daoPath: "./internal/dao"
        doPath: "./internal/model/do"
        entityPath: "./internal/model/entity"
        # 金额 decimal 化：全局 NUMERIC → decimal.Decimal
        typeMapping:
          decimal:
            type: decimal.Decimal
            import: github.com/shopspring/decimal
          numeric:
            type: decimal.Decimal
            import: github.com/shopspring/decimal
        # 可空金额列 → *decimal.Decimal
        fieldMapping:
          bil_wallets.warning_threshold:
            type: "*decimal.Decimal"
            import: github.com/shopspring/decimal
          mdl_pricing.per_request_price:
            type: "*decimal.Decimal"
            import: github.com/shopspring/decimal
          mdl_tenant_models.custom_input_price:
            type: "*decimal.Decimal"
            import: github.com/shopspring/decimal
          mdl_tenant_models.custom_output_price:
            type: "*decimal.Decimal"
            import: github.com/shopspring/decimal
          mdl_tenant_models.per_request_price:
            type: "*decimal.Decimal"
            import: github.com/shopspring/decimal
          mdl_tenant_models.custom_cache_read_price:
            type: "*decimal.Decimal"
            import: github.com/shopspring/decimal
          mdl_tenant_models.custom_cache_creation_price:
            type: "*decimal.Decimal"
            import: github.com/shopspring/decimal
          mdl_tenant_models.discount_ratio:
            type: "*decimal.Decimal"
            import: github.com/shopspring/decimal
          api_keys.total_quota:
            type: "*decimal.Decimal"
            import: github.com/shopspring/decimal
          tnt_projects.budget:
            type: "*decimal.Decimal"
            import: github.com/shopspring/decimal
    ctrl:
      - apiPath:       "./api"
        outPath:       "./internal/controller"
        withService:   true
        withModel:     false
        merge:         true

  docker:
    build: "-a amd64 -s linux -p temp -ew"
    tagPrefixes:
      - team-api
