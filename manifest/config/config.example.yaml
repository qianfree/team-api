# Team-API Runtime Configuration

# Server
server:
  address:     ":18888"
  serverAgent: "team-api"
  dumpRouterMap: false
  gracefulShutdownTimeout: 30

# Logger
logger:
  level:  "all"
  stdout: true
  ctxKeys: ["RequestId"]
  # path: "./logs"             # 取消注释并设置路径即可落盘，Docker 建议用 /app/logs
  # file: "{Y-m-d}.log"
  # rotateSize: "100MB"
  # rotateExpire: "1d"
  # rotateBackupLimit: 30
  # rotateBackupExpire: "30d"
  # rotateBackupCompress: 9

# Database (PostgreSQL)
database:
  default:
    type:     "pgsql"
    link:     "pgsql:<user>:<password>@tcp(<host>:<port>)/<database>?sslmode=disable"
    timezone: "Asia/Shanghai"
    debug:    false
    dryRun:   false
    maxIdle:  10
    maxOpen:  100
    maxLifetime: "30s"

  # 审计日志独立数据库（可选）
  # 启用后 aud_request_logs（大模型请求审计）写入独立库，其余审核表仍在主库。
  # 建表脚本见 docs/audit-db-schema.sql，需在审计库手动执行。
  # audit:
  #   type:     "pgsql"
  #   link:     "pgsql:user:pass@tcp(host:port)/team-api-audit?sslmode=disable"
  #   timezone: "Asia/Shanghai"
  #   maxIdle:  10
  #   maxOpen:  50
  #   maxLifetime: "5m"

# Redis
redis:
  default:
    address: "<host>:<port>"
    db:      0

# Cache (GoFrame built-in, uses Redis as adapter)
cache:
  default:
    adapter: "redis"

# JWT Authentication
jwt:
  secret:          "<change-me-to-a-random-secret>"
  accessTokenExpire:  "12h"
  refreshTokenExpire: "7d"
  issuer:          "team-api"
  adminMaxSessions:  5
  tenantMaxSessions: 10

# Crypto (AES-256 encryption key, 32 bytes hex-encoded = 64 hex chars)
crypto:
  encryptionKey: "a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7f8a9b0c1d2e3f4a5b6c7d8e9f0a1b2"


# Demo mode (read-only mode, configured here — not in admin UI)
# Set enabled: true to block all write operations and show a watermark
demo:
  enabled: false
  message: "演示环境，数据不可修改"

# Channel proxy (for accessing Google/Anthropic etc. from China)
channel_proxy_url: ""

# Relaykit 转换器（relay 层协议转换模块化改造，分阶段灰度）
# enabled: 全局开关，false 时所有请求走旧 relay 代码路径（默认）
# providers: 启用 relaykit 的供应商白名单（为空 = 全部走旧路径）
#   值对应供应商 key：claude / gemini / openai / coze / dify / ollama
#   渠道类型→key 的映射见 relay/handler/relaykit_bridge.go 的 providerKeyForChannelType
# 回滚：改 enabled 为 false 并重启服务即可，无需重编译
relaykit:
  enabled: false
  providers: []
